name: Update profile README

on:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 1 点（北京时间 9 点），在博客每日重建之后
  workflow_dispatch: # 允许在 Actions 页面手动触发
  push:
    branches:
      - main
    paths:
      - scripts/update-readme.mjs
      - .github/workflows/update-readme.yml

permissions:
  contents: write # 需要把更新后的 README 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update latest posts
        run: node scripts/update-readme.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update latest posts"
            git push
          fi
